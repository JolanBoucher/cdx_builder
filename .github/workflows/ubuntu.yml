name: Ubuntu Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules
        run: |
          git submodule update --init --recursive

      - name: Debug submodules
        run: |
          echo "===== SUBMODULE STATUS ====="
          git submodule status --recursive

          echo "===== DEPS ====="
          ls -la deps

          echo "===== SDSL ====="
          ls -la deps/sdsl-lite

          echo "===== MAKE.HELPER ====="
          ls -la deps/sdsl-lite/Make.helper

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            libssl-dev \
            libzstd-dev \
            zlib1g-dev \
            libomp-dev \
            libboost-all-dev \
            libcli11-dev \
            libjansson-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j4
