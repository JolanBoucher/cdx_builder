name: Ubuntu Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 20.04 is the minimum supported version (see README);
        # 24.04 is kept alongside it to catch regressions on newer toolchains.
        os: [ubuntu-20.04, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            libssl-dev \
            libzstd-dev \
            zlib1g-dev \
            libomp-dev \
            libboost-all-dev \
            libjansson-dev

      # Ubuntu 20.04's default GCC is 9.4, but the project requires GCC >= 11
      # (see CMakeLists.txt). Pull a newer compiler from the toolchain PPA.
      - name: Install GCC 11 (Ubuntu 20.04 only)
        if: matrix.os == 'ubuntu-20.04'
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install -y gcc-11 g++-11
          echo "CC=gcc-11" >> "$GITHUB_ENV"
          echo "CXX=g++-11" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          ${CXX:-g++} --version
          cmake --version
          ninja --version

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --verbose -j"$(nproc)"

      - name: Show generated Make.helper (debug, on failure only)
        if: failure()
        run: |
          find build -name Make.helper -exec echo "==== {} ====" \; -exec cat {} \;
